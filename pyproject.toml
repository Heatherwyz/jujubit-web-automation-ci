[tool.pytest.ini_options]
# 默认只收集 tests/ 下的离线单测，避免裸跑 pytest 时误触发访问线上站点的
# python_playwright/tests。完整回归由 run_all.py 通过 -c pytest-playwright.ini 指定。
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "cart_session: 仅在登录状态文件存在时为购物车主流程加载该状态",
    "cart_smoke: 单一登录上下文的低频购物车主链路；不计入完整 30 条回归",
    "html_contract: 服务端 HTML 契约层；不起浏览器、不分端，结论确定应保持全绿",
    "membership_session: 会员用例需要登录态；支付相关仅走到拉起表单，不产生真实扣款",
    "membership: 会员模块全部用例（付费墙、管理页、引流入口、弹窗、埋点）",
]
