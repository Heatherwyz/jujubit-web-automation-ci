name: JuJuBit 购物车 UI Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "选择购物车执行范围（每日分层为 PC 15 条 + H5 关键 6 条；完整回归会实际操作账号购物车）"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - daily
          - full
  schedule:
    # GitHub Actions 的 cron 使用 UTC。01:00 UTC = 中国标准时间 09:00，
    # 13:00 UTC = 21:00，早晚各一轮，与首页回归同一时刻触发。
    # 两个工作流共用下方并发组，因此不会同时访问站点，后到的自动排队。
    #
    # 周一至周六早班执行每日分层（21 条）。
    - cron: "0 1 * * 1-6"
    # 周日早班执行完整 30 条；晚班仍走分层，避免一天两次完整回归的账号副作用。
    - cron: "0 1 * * 0"
    # 每天晚班统一执行每日分层。
    - cron: "0 13 * * *"

# 与每日首页回归串行执行，避免两个 Runner 从不同出口同时访问同一登录账号。
concurrency:
  group: jujubit-site-ui-tests
  cancel-in-progress: false

permissions:
  # write 是为了把 HTML 报告推到 test-reports 分支；仅该分支被写入，
  # 主分支不受影响（发布步骤显式指定 push origin test-reports）。
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 完整购物车回归包含生成任务；周日早班执行完整套件，其余班次执行分层套件。
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-playwright.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium

      - name: 准备购物车登录状态
        shell: bash
        env:
          PLAYWRIGHT_STORAGE_STATE_JSON: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON }}
        run: |
          # 登录态只在此临时 Runner 还原；不提交 storage-state.json 到仓库。
          if [[ -z "$PLAYWRIGHT_STORAGE_STATE_JSON" ]]; then
            echo "::error::未配置 PLAYWRIGHT_STORAGE_STATE_JSON，无法安全执行购物车登录回归。"
            exit 1
          fi
          mkdir -p artifacts/auth
          printf '%s' "$PLAYWRIGHT_STORAGE_STATE_JSON" > artifacts/auth/storage-state.json
          python -m json.tool artifacts/auth/storage-state.json >/dev/null
          chmod 600 artifacts/auth/storage-state.json

      - name: 校验报告与频控逻辑
        # 离线单测不访问站点，提前发现报告或频控逻辑的回归。
        run: python -m pytest tests -q

      - name: 记录测试开始时间
        id: test_meta
        shell: bash
        run: echo "started_at=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_OUTPUT"

      - name: 执行购物车 UI 回归
        id: suite
        shell: bash
        run: |
          # 只有周日早班（0 1 * * 0）执行完整 30 条，其余定时班次都执行 21 条
          # 分层回归（PC 15 条 + H5 关键 6 条）。晚班固定分层：完整回归会真实
          # 生成模型并写入购物车，一天跑两次会让账号副作用翻倍。
          # 手动触发仍由 inputs.suite 决定。
          set +e
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 1 * * 0" ]]; then
              suite="full"
            else
              suite="daily"
            fi
          else
            suite="${{ inputs.suite }}"
          fi
          case "$suite" in
            smoke)
              # 一次登录上下文串起生成、加购、全屏购物车和 Checkout，减少 WAF 请求峰值。
              python run_all.py --cart-suite smoke --platform pc --cart-request-interval 6
              run_status=$?
              suite_label="Smoke：PC 主链路 1 条"
              planned_cases="1"
              ;;
            daily)
              python run_all.py --cart-suite daily --cart-request-interval 6
              run_status=$?
              suite_label="每日分层：PC 15 条 + H5 关键 6 条"
              planned_cases="21"
              ;;
            full)
              python run_all.py --cart-suite full --cart-request-interval 6
              run_status=$?
              suite_label="完整回归：PC 15 条 + H5 15 条"
              planned_cases="30"
              ;;
            *)
              echo "未知购物车执行范围：$suite" >&2
              exit 2
              ;;
          esac
          exit_code=${run_status:-2}
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"
          echo "suite_label=${suite_label}" >> "$GITHUB_OUTPUT"
          echo "planned_cases=${planned_cases}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 定位本次报告
        id: report
        if: always()
        shell: bash
        run: |
          run_dir=$(find artifacts/runs -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort | tail -n 1 || true)
          if [[ -z "$run_dir" ]]; then
            echo "未找到本次运行目录：artifacts/runs" >&2
            exit 1
          fi
          run_dir=${run_dir%/}
          run_id=$(basename "$run_dir")
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "results_xml=${run_dir}/results.xml" >> "$GITHUB_OUTPUT"
          if [[ -f "${run_dir}/results.xml" ]]; then
            actual_cases=$(python -c 'import sys; from xml.etree import ElementTree; root = ElementTree.parse(sys.argv[1]).getroot(); print(sum(1 for node in root.iter() if node.tag.rsplit("}", 1)[-1] == "testcase"))' "${run_dir}/results.xml")
          else
            actual_cases="未生成"
          fi
          echo "actual_cases=${actual_cases}" >> "$GITHUB_OUTPUT"
          if [[ -f "${run_dir}/jujubit-report-${run_id}.html" ]]; then
            {
              echo "### JuJuBit 购物车自动化测试报告"
              echo "- 执行套件：${{ steps.suite.outputs.suite_label }}"
              echo "- 计划 / 实际收集：${{ steps.suite.outputs.planned_cases }} / ${actual_cases} 条"
              echo "- 本次目录：\`${run_id}\`"
              echo "- HTML 报告和失败录像：见下方 Artifact 下载项"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传 HTML 报告、失败截图和录像
        id: upload_report
        if: always() && steps.report.outputs.run_dir != ''
        # artifact 存储配额打满时这一步会失败（2026-09-16 出现过）。它只是备份
        # 通道——报告已发布到 test-reports 分支且不占配额，所以不因此让整个
        # Job 失败，避免把"配额不足"误报成"测试失败"。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # 时间戳使每次报告和录像下载项具有唯一名称。
          name: jujubit-cart-${{ steps.suite.outputs.suite }}-report-${{ steps.report.outputs.run_id }}
          path: ${{ steps.report.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 30

      # 与首页工作流一致：把 HTML 报告发布到 test-reports 分支换取直链。
      # 不用 GitHub Pages（私有仓库需付费套餐，且 Pages 内容公网可访问，
      # 而报告含站点地址与失败详情）。
      - name: 检出 test-reports 分支
        id: checkout_reports
        if: always() && steps.report.outputs.run_dir != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: test-reports
          path: .report-branch
          persist-credentials: true

      - name: 发布报告到 test-reports 分支
        id: publish_report
        if: always() && steps.report.outputs.run_dir != ''
        continue-on-error: true
        shell: bash
        env:
          RUN_DIR: ${{ steps.report.outputs.run_dir }}
          RUN_ID: ${{ steps.report.outputs.run_id }}
          SUITE: cart
          KEEP: "30"
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "RUN_ID 含非法字符：$RUN_ID" >&2
            exit 1
          fi
          report=$(find "$RUN_DIR" -maxdepth 1 -name '*.html' -print | sort | tail -1)
          if [[ -z "$report" ]]; then
            echo "未找到 HTML 报告，跳过发布。" >&2
            exit 0
          fi

          branch_dir=.report-branch
          if [[ ! -d "$branch_dir/.git" ]]; then
            # 分支不存在时上一步的 checkout 会失败并可能留下空目录；这里重建。
            rm -rf "$branch_dir"
            mkdir -p "$branch_dir"
            git -C "$branch_dir" init
            git -C "$branch_dir" remote add origin \
              "${{ github.server_url }}/${{ github.repository }}.git"
            git -C "$branch_dir" config \
              http."${{ github.server_url }}/".extraheader \
              "AUTHORIZATION: basic $(printf 'x-access-token:%s' \
              "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)"
          fi
          # 无条件确保当前分支名是 test-reports。
          # 上一版把它放在 if 里，而分支不存在时 checkout action 已留下 .git，
          # 条件判假 -> 整段被跳过 -> git 停在默认 master -> push 报
          # "src refspec test-reports does not match any"。两次真实运行都栽在这。
          git -C "$branch_dir" checkout -B test-reports
          git -C "$branch_dir" config user.name 'github-actions[bot]'
          git -C "$branch_dir" config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          dest="$branch_dir/$SUITE/$RUN_ID"
          mkdir -p "$dest"
          cp "$report" "$dest/"

          suite_dir="$branch_dir/$SUITE"
          mapfile -t runs < <(find "$suite_dir" -mindepth 1 -maxdepth 1 -type d \
            -printf '%f\n' | sort)
          total=${#runs[@]}
          if (( total > KEEP )); then
            for (( i=0; i < total - KEEP; i++ )); do
              rm -rf "$suite_dir/${runs[i]}"
              echo "清理旧报告：${runs[i]}"
            done
          fi

          {
            echo "<!doctype html><html lang='zh'><head><meta charset='utf-8'>"
            echo "<title>JuJuBit 自动化测试报告</title>"
            echo "<style>body{font-family:system-ui,sans-serif;margin:32px;max-width:900px}"
            echo "h1{font-size:20px}h2{font-size:16px;margin-top:24px}li{margin:4px 0}</style>"
            echo "</head><body><h1>JuJuBit 自动化测试报告</h1>"
            echo "<p>按套件和运行时间归档，每个套件保留最近 ${KEEP} 份。链接受仓库权限保护。</p>"
            for s in $(find "$branch_dir" -mindepth 1 -maxdepth 1 -type d \
                -not -name '.*' -printf '%f\n' | sort); do
              echo "<h2>${s}</h2><ul>"
              for r in $(find "$branch_dir/$s" -mindepth 1 -maxdepth 1 -type d \
                  -printf '%f\n' | sort -r); do
                f=$(find "$branch_dir/$s/$r" -maxdepth 1 -name '*.html' -printf '%f\n' \
                  | sort | head -1)
                [[ -z "$f" ]] && continue
                echo "<li><a href='${{ github.server_url }}/${{ github.repository }}/blob/test-reports/${s}/${r}/${f}?raw=1'>${r}</a></li>"
              done
              echo "</ul>"
            done
            echo "</body></html>"
          } > "$branch_dir/index.html"

          git -C "$branch_dir" add -A
          if git -C "$branch_dir" diff --cached --quiet; then
            echo "报告无变化，无需提交。"
          else
            git -C "$branch_dir" commit -m "发布 cart 测试报告 $RUN_ID"
            git -C "$branch_dir" push origin test-reports
          fi

          name=$(basename "$report")
          # 用 raw.githubusercontent.com：blob/...?raw=1 在私有仓库里会 404。
          # 注意 GitHub 对仓库内 HTML 强制 text/plain + nosniff，浏览器只显示
          # 源码不渲染，所以这个链接是"下载后本地打开"，可读结论看 Job Summary。
          raw_base="https://raw.githubusercontent.com/${{ github.repository }}/test-reports"
          url="$raw_base/$SUITE/$RUN_ID/$name"
          index="$raw_base/index.html"
          {
            echo "report_url=$url"
            echo "index_url=$index"
          } >> "$GITHUB_OUTPUT"
          echo "报告链接：$url"

      # 把结论渲染进 Job Summary：这是唯一能在浏览器里直接读的地方
      # （仓库内 HTML 不渲染，私有仓库又不能用 Pages）。
      - name: 写入运行摘要
        if: always() && steps.report.outputs.results_xml != ''
        continue-on-error: true
        env:
          RESULTS_XML: ${{ steps.report.outputs.results_xml }}
          SUITE_LABEL: 购物车 UI 回归
          REPORT_RUN_ID: ${{ steps.report.outputs.run_id }}
          REPORT_HTML_URL: ${{ steps.publish_report.outputs.report_url }}
          REPORT_INDEX_URL: ${{ steps.publish_report.outputs.index_url }}
        run: python scripts/write_job_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: 推送结果到飞书群
        if: always()
        continue-on-error: true
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          RESULTS_XML: ${{ steps.report.outputs.results_xml }}
          REPORT_RUN_ID: ${{ steps.report.outputs.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          REPORT_HTML_URL: ${{ steps.publish_report.outputs.report_url }}
          TEST_EXIT_CODE: ${{ steps.suite.outputs.exit_code }}
          TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_ACTOR: ${{ github.actor }}
          TEST_COMMIT: ${{ github.sha }}
          TEST_STARTED_AT: ${{ steps.test_meta.outputs.started_at }}
          TEST_SUITE: ${{ steps.suite.outputs.suite }}
          TEST_SUITE_LABEL: ${{ steps.suite.outputs.suite_label }}
          TEST_PLANNED_CASES: ${{ steps.suite.outputs.planned_cases }}
          TEST_ACTUAL_CASES: ${{ steps.report.outputs.actual_cases }}
        run: python scripts/send_lark_test_report.py

      - name: 保持 GitHub 运行结果与测试结果一致
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.suite.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then exit_code=1; fi
          exit "$exit_code"
