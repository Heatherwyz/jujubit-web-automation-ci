name: JuJuBit 购物车 UI Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "选择购物车执行范围（每日分层为 PC 15 条 + H5 关键 6 条；完整回归会实际操作账号购物车）"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - daily
          - full
  schedule:
    # GitHub Actions 的 cron 使用 UTC；02:00 UTC 即中国标准时间每天 10:00。
    # 与 09:00 的首页回归错开一小时；若首页尚未结束，会由下方并发队列自动等待。
    # 周一至周六执行每日分层；周日由下一条计划替代，避免一天运行两次。
    - cron: "0 2 * * 1-6"
    # 每周日 03:00 UTC（中国标准时间 11:00）执行完整 30 条。
    - cron: "0 3 * * 0"

# 与每日首页回归串行执行，避免两个 Runner 从不同出口同时访问同一登录账号。
concurrency:
  group: jujubit-site-ui-tests
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 完整购物车回归包含生成任务；周一至周六执行分层套件，周日执行完整套件。
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-playwright.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium

      - name: 准备购物车登录状态
        shell: bash
        env:
          PLAYWRIGHT_STORAGE_STATE_JSON: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON }}
        run: |
          # 登录态只在此临时 Runner 还原；不提交 storage-state.json 到仓库。
          if [[ -z "$PLAYWRIGHT_STORAGE_STATE_JSON" ]]; then
            echo "::error::未配置 PLAYWRIGHT_STORAGE_STATE_JSON，无法安全执行购物车登录回归。"
            exit 1
          fi
          mkdir -p artifacts/auth
          printf '%s' "$PLAYWRIGHT_STORAGE_STATE_JSON" > artifacts/auth/storage-state.json
          python -m json.tool artifacts/auth/storage-state.json >/dev/null
          chmod 600 artifacts/auth/storage-state.json

      - name: 校验报告与频控逻辑
        # 离线单测不访问站点，提前发现报告或频控逻辑的回归。
        run: python -m pytest tests -q

      - name: 记录测试开始时间
        id: test_meta
        shell: bash
        run: echo "started_at=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_OUTPUT"

      - name: 执行购物车 UI 回归
        id: suite
        shell: bash
        run: |
          # 周一至周六执行 21 条分层购物车回归（PC 15 条 + H5 关键 6 条）；
          # 周日执行完整 30 条。手动触发可选择 smoke、daily、full。
          set +e
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 3 * * 0" ]]; then
              suite="full"
            else
              suite="daily"
            fi
          else
            suite="${{ inputs.suite }}"
          fi
          case "$suite" in
            smoke)
              # 一次登录上下文串起生成、加购、全屏购物车和 Checkout，减少 WAF 请求峰值。
              python run_all.py --cart-suite smoke --platform pc --cart-request-interval 6
              run_status=$?
              suite_label="Smoke：PC 主链路 1 条"
              planned_cases="1"
              ;;
            daily)
              python run_all.py --cart-suite daily --cart-request-interval 6
              run_status=$?
              suite_label="每日分层：PC 15 条 + H5 关键 6 条"
              planned_cases="21"
              ;;
            full)
              python run_all.py --cart-suite full --cart-request-interval 6
              run_status=$?
              suite_label="完整回归：PC 15 条 + H5 15 条"
              planned_cases="30"
              ;;
            *)
              echo "未知购物车执行范围：$suite" >&2
              exit 2
              ;;
          esac
          exit_code=${run_status:-2}
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"
          echo "suite_label=${suite_label}" >> "$GITHUB_OUTPUT"
          echo "planned_cases=${planned_cases}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 定位本次报告
        id: report
        if: always()
        shell: bash
        run: |
          run_dir=$(find artifacts/runs -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort | tail -n 1 || true)
          if [[ -z "$run_dir" ]]; then
            echo "未找到本次运行目录：artifacts/runs" >&2
            exit 1
          fi
          run_dir=${run_dir%/}
          run_id=$(basename "$run_dir")
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "results_xml=${run_dir}/results.xml" >> "$GITHUB_OUTPUT"
          if [[ -f "${run_dir}/results.xml" ]]; then
            actual_cases=$(python -c 'import sys; from xml.etree import ElementTree; root = ElementTree.parse(sys.argv[1]).getroot(); print(sum(1 for node in root.iter() if node.tag.rsplit("}", 1)[-1] == "testcase"))' "${run_dir}/results.xml")
          else
            actual_cases="未生成"
          fi
          echo "actual_cases=${actual_cases}" >> "$GITHUB_OUTPUT"
          if [[ -f "${run_dir}/jujubit-report-${run_id}.html" ]]; then
            {
              echo "### JuJuBit 购物车自动化测试报告"
              echo "- 执行套件：${{ steps.suite.outputs.suite_label }}"
              echo "- 计划 / 实际收集：${{ steps.suite.outputs.planned_cases }} / ${actual_cases} 条"
              echo "- 本次目录：\`${run_id}\`"
              echo "- HTML 报告和失败录像：见下方 Artifact 下载项"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传 HTML 报告、失败截图和录像
        id: upload_report
        if: always() && steps.report.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          # 时间戳使每次报告和录像下载项具有唯一名称。
          name: jujubit-cart-${{ steps.suite.outputs.suite }}-report-${{ steps.report.outputs.run_id }}
          path: ${{ steps.report.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: 推送结果到飞书群
        if: always()
        continue-on-error: true
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          RESULTS_XML: ${{ steps.report.outputs.results_xml }}
          REPORT_RUN_ID: ${{ steps.report.outputs.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          TEST_EXIT_CODE: ${{ steps.suite.outputs.exit_code }}
          TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_ACTOR: ${{ github.actor }}
          TEST_COMMIT: ${{ github.sha }}
          TEST_STARTED_AT: ${{ steps.test_meta.outputs.started_at }}
          TEST_SUITE: ${{ steps.suite.outputs.suite }}
          TEST_SUITE_LABEL: ${{ steps.suite.outputs.suite_label }}
          TEST_PLANNED_CASES: ${{ steps.suite.outputs.planned_cases }}
          TEST_ACTUAL_CASES: ${{ steps.report.outputs.actual_cases }}
        run: python scripts/send_lark_test_report.py

      - name: 保持 GitHub 运行结果与测试结果一致
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.suite.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then exit_code=1; fi
          exit "$exit_code"
