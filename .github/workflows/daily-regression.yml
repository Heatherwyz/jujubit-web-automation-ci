name: 每日全量回归（北京 09:00 / 21:00）

# 唯一的定时入口：一个工作流按顺序跑所有套件。
# 不再跨工作流 dispatch（GITHUB_TOKEN 触发同仓库 dispatch 有速率限制，
# 连续 HTTP 500）。各套件作为同一 Job 的不同 Step 串行执行。
#
# 各业务工作流（daily-ui-tests / membership-ui-tests / cart-ui-tests）
# 仍保留 workflow_dispatch 入口，供手动单独触发。
#
# 准时入口由 Supabase pg_cron 调 workflow_dispatch（见
# docs/supabase-scheduler.md）。GitHub 自己的 schedule 已停用：对本仓库
# 长期迟到 4–5 小时，与外部调度并存会让同一天重复跑全量（每轮约 40 分钟，
# 且购物车层会真实操作测试账号）。
on:
  workflow_dispatch:

concurrency:
  group: jujubit-site-ui-tests
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  regression:
    name: 全量回归
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-playwright.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium

      - name: 准备登录状态
        shell: bash
        env:
          PLAYWRIGHT_STORAGE_STATE_JSON: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON }}
        run: |
          # 会员登录态用例与购物车共用同一份 Secret；首页用例不读这个文件。
          if [[ -z "$PLAYWRIGHT_STORAGE_STATE_JSON" ]]; then
            echo "::warning::未配置 PLAYWRIGHT_STORAGE_STATE_JSON，需登录态的会员/购物车用例将记为未完成。"
            exit 0
          fi
          mkdir -p artifacts/auth
          printf '%s' "$PLAYWRIGHT_STORAGE_STATE_JSON" > artifacts/auth/storage-state.json
          python -m json.tool artifacts/auth/storage-state.json >/dev/null
          chmod 600 artifacts/auth/storage-state.json

      # ---- 1. 离线检查（< 30 秒）----
      - name: 离线单测
        run: python -m pytest -q

      # ---- 2. 首页 UI 回归 ----
      - name: 记录开始时间
        id: test_meta
        shell: bash
        run: echo "started_at=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_OUTPUT"

      - name: 执行首页 UI 回归
        id: home_suite
        shell: bash
        run: |
          set +e
          python run_all.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 定位首页报告
        id: home_report
        if: always()
        shell: bash
        run: |
          run_dir=$(find artifacts/runs -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort | tail -n 1 || true)
          if [[ -z "$run_dir" ]]; then exit 0; fi
          run_dir=${run_dir%/}
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "run_id=$(basename "$run_dir")" >> "$GITHUB_OUTPUT"
          echo "results_xml=${run_dir}/results.xml" >> "$GITHUB_OUTPUT"

      - name: 首页飞书通知
        if: always() && steps.home_report.outputs.results_xml != ''
        continue-on-error: true
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          RESULTS_XML: ${{ steps.home_report.outputs.results_xml }}
          REPORT_RUN_ID: ${{ steps.home_report.outputs.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_EXIT_CODE: ${{ steps.home_suite.outputs.exit_code }}
          TEST_BRANCH: ${{ github.ref_name }}
          TEST_ACTOR: ${{ github.actor }}
          TEST_COMMIT: ${{ github.sha }}
          TEST_STARTED_AT: ${{ steps.test_meta.outputs.started_at }}
        run: python scripts/send_lark_test_report.py

      - name: 首页 Job Summary
        if: always() && steps.home_report.outputs.results_xml != ''
        continue-on-error: true
        env:
          RESULTS_XML: ${{ steps.home_report.outputs.results_xml }}
          SUITE_LABEL: 首页 UI 回归
          REPORT_RUN_ID: ${{ steps.home_report.outputs.run_id }}
        run: python scripts/write_job_summary.py >> "$GITHUB_STEP_SUMMARY"

      # ---- 3. 会员 UI 回归 ----
      - name: 执行会员 UI 回归
        id: mem_suite
        if: always()
        shell: bash
        run: |
          set +e
          python run_all.py --membership-only
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 定位会员报告
        id: mem_report
        if: always()
        shell: bash
        run: |
          # 会员的 run_dir 是最新的那个（首页的已被上面取过）
          run_dir=$(find artifacts/runs -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort | tail -n 1 || true)
          if [[ -z "$run_dir" ]]; then exit 0; fi
          run_dir=${run_dir%/}
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "run_id=$(basename "$run_dir")" >> "$GITHUB_OUTPUT"
          echo "results_xml=${run_dir}/results.xml" >> "$GITHUB_OUTPUT"

      - name: 会员飞书通知
        if: always() && steps.mem_report.outputs.results_xml != ''
        continue-on-error: true
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          RESULTS_XML: ${{ steps.mem_report.outputs.results_xml }}
          REPORT_RUN_ID: ${{ steps.mem_report.outputs.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_EXIT_CODE: ${{ steps.mem_suite.outputs.exit_code }}
          TEST_BRANCH: ${{ github.ref_name }}
          TEST_ACTOR: ${{ github.actor }}
          TEST_COMMIT: ${{ github.sha }}
          TEST_STARTED_AT: ${{ steps.test_meta.outputs.started_at }}
        run: python scripts/send_lark_test_report.py

      - name: 会员 Job Summary
        if: always() && steps.mem_report.outputs.results_xml != ''
        continue-on-error: true
        env:
          RESULTS_XML: ${{ steps.mem_report.outputs.results_xml }}
          SUITE_LABEL: 会员 UI 回归
          REPORT_RUN_ID: ${{ steps.mem_report.outputs.run_id }}
        run: python scripts/write_job_summary.py >> "$GITHUB_STEP_SUMMARY"

      # ---- 4. 购物车 UI 回归 ----
      - name: 执行购物车 UI 回归
        id: cart_suite
        if: always()
        shell: bash
        run: |
          set +e
          python run_all.py --cart-daily
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 定位购物车报告
        id: cart_report
        if: always()
        shell: bash
        run: |
          run_dir=$(find artifacts/runs -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort | tail -n 1 || true)
          if [[ -z "$run_dir" ]]; then exit 0; fi
          run_dir=${run_dir%/}
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "run_id=$(basename "$run_dir")" >> "$GITHUB_OUTPUT"
          echo "results_xml=${run_dir}/results.xml" >> "$GITHUB_OUTPUT"

      - name: 购物车飞书通知
        if: always() && steps.cart_report.outputs.results_xml != ''
        continue-on-error: true
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          RESULTS_XML: ${{ steps.cart_report.outputs.results_xml }}
          REPORT_RUN_ID: ${{ steps.cart_report.outputs.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_EXIT_CODE: ${{ steps.cart_suite.outputs.exit_code }}
          TEST_BRANCH: ${{ github.ref_name }}
          TEST_ACTOR: ${{ github.actor }}
          TEST_COMMIT: ${{ github.sha }}
          TEST_STARTED_AT: ${{ steps.test_meta.outputs.started_at }}
        run: python scripts/send_lark_test_report.py

      - name: 购物车 Job Summary
        if: always() && steps.cart_report.outputs.results_xml != ''
        continue-on-error: true
        env:
          RESULTS_XML: ${{ steps.cart_report.outputs.results_xml }}
          SUITE_LABEL: 购物车 UI 回归
          REPORT_RUN_ID: ${{ steps.cart_report.outputs.run_id }}
        run: python scripts/write_job_summary.py >> "$GITHUB_STEP_SUMMARY"

      # ---- 上传全部报告 ----
      - name: 上传全部报告
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jujubit-regression-${{ steps.home_report.outputs.run_id || 'unknown' }}
          path: artifacts/runs/
          if-no-files-found: warn
          retention-days: 30

      # ---- 发布报告到 test-reports 分支 ----
      # 只上传 Artifact 不够：那是 ZIP，要下载解压才能看到 HTML 与失败录像。
      # 发布到分支后能直接点链接，且链接受仓库权限保护。
      # 合并成单一工作流时漏掉了这一段，导致报告页 503、看不到录屏（2026-09-23）。
      - name: 检出 test-reports 分支
        id: checkout_reports
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: test-reports
          path: .report-branch
          persist-credentials: true

      - name: 发布三层报告到 test-reports 分支
        id: publish_reports
        if: always()
        continue-on-error: true
        shell: bash
        env:
          HOME_RUN_DIR: ${{ steps.home_report.outputs.run_dir }}
          HOME_RUN_ID: ${{ steps.home_report.outputs.run_id }}
          MEM_RUN_DIR: ${{ steps.mem_report.outputs.run_dir }}
          MEM_RUN_ID: ${{ steps.mem_report.outputs.run_id }}
          CART_RUN_DIR: ${{ steps.cart_report.outputs.run_dir }}
          CART_RUN_ID: ${{ steps.cart_report.outputs.run_id }}
          KEEP: "30"
          # 报告链接必须走 GitHub Pages，不能用 raw.githubusercontent.com：
          # GitHub 对仓库内 .html 强制 text/plain + nosniff，raw 链接只会显示
          # 源码（实测 contentType=text/plain、整页包在一个 <pre> 里），
          # 看起来就像报告页打不开（2026-09-24 实测）。
          # Pages 已在本库启用，源为 test-reports 分支根目录。
          PAGES_BASE: https://heatherwyz.github.io/jujubit-web-automation-ci
        run: |
          set -euo pipefail
          branch_dir=.report-branch
          if [[ ! -d "$branch_dir/.git" ]]; then
            # 分支不存在时上一步 checkout 会失败并可能留下空目录，这里重建。
            rm -rf "$branch_dir"
            mkdir -p "$branch_dir"
            git -C "$branch_dir" init
            git -C "$branch_dir" remote add origin \
              "${{ github.server_url }}/${{ github.repository }}.git"
            git -C "$branch_dir" config \
              http."${{ github.server_url }}/".extraheader \
              "AUTHORIZATION: basic $(printf 'x-access-token:%s' \
              "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)"
          fi
          # 无条件确保分支名正确：放进 if 里会在 checkout 已留下 .git 时被跳过，
          # git 停在默认 master，push 报 "src refspec does not match any"。
          git -C "$branch_dir" checkout -B test-reports
          git -C "$branch_dir" config user.name 'github-actions[bot]'
          git -C "$branch_dir" config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          published=0
          publish_one() {
            local suite="$1" run_dir="$2" run_id="$3"
            [[ -z "$run_dir" || -z "$run_id" ]] && return 0
            [[ ! -d "$run_dir" ]] && return 0
            # run_id 来自 run_all.py 的时间戳，再校验一次，拒绝路径分隔符。
            if [[ ! "$run_id" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "run_id 含非法字符，跳过 $suite：$run_id" >&2
              return 0
            fi
            local report
            report=$(find "$run_dir" -maxdepth 1 -name '*.html' -print | sort | tail -1)
            if [[ -z "$report" ]]; then
              echo "$suite 未找到 HTML 报告，跳过。" >&2
              return 0
            fi
            local dest="$branch_dir/$suite/$run_id"
            mkdir -p "$dest"
            cp "$report" "$dest/"
            # 失败截图与录像一起发布，否则报告里的相对链接全是 404。
            # 目录名按 conftest 实际生成的来：screenshots（不是 failure-screenshots）
            # 与 failure-videos，写错会静默跳过、报告里链接照样 404。
            for asset in failure-videos screenshots; do
              if [[ -d "$run_dir/$asset" ]]; then
                # raw 是仅用于转存的中间产物，不发布。
                cp -R "$run_dir/$asset" "$dest/"
                rm -rf "$dest/$asset/raw"
              fi
            done
            published=1
            echo "已发布 $suite/$run_id"
          }

          publish_one home "$HOME_RUN_DIR" "$HOME_RUN_ID"
          publish_one membership "$MEM_RUN_DIR" "$MEM_RUN_ID"
          publish_one cart "$CART_RUN_DIR" "$CART_RUN_ID"

          if [[ "$published" == "0" ]]; then
            echo "三层都没有可发布的报告，跳过提交。"
            exit 0
          fi

          # 每个套件只保留最近 KEEP 份，避免仓库体积膨胀。
          for suite_dir in "$branch_dir"/*/; do
            [[ -d "$suite_dir" ]] || continue
            case "$(basename "$suite_dir")" in .*) continue ;; esac
            mapfile -t runs < <(find "$suite_dir" -mindepth 1 -maxdepth 1 -type d \
              -printf '%f\n' | sort)
            total=${#runs[@]}
            if (( total > KEEP )); then
              for (( i=0; i < total - KEEP; i++ )); do
                rm -rf "$suite_dir/${runs[i]}"
                echo "清理旧报告：$(basename "$suite_dir")/${runs[i]}"
              done
            fi
          done

          # 索引页，便于翻历史。
          {
            echo "<!doctype html><html lang='zh'><head><meta charset='utf-8'>"
            echo "<title>JuJuBit 自动化测试报告</title>"
            echo "<style>body{font-family:system-ui,sans-serif;margin:32px;max-width:900px}"
            echo "h1{font-size:20px}h2{font-size:16px;margin-top:24px}li{margin:4px 0}</style>"
            echo "</head><body><h1>JuJuBit 自动化测试报告</h1>"
            echo "<p>按套件和运行时间归档，每个套件保留最近 ${KEEP} 份。</p>"
            for s in $(find "$branch_dir" -mindepth 1 -maxdepth 1 -type d \
                -not -name '.*' -printf '%f\n' | sort); do
              echo "<h2>${s}</h2><ul>"
              for r in $(find "$branch_dir/$s" -mindepth 1 -maxdepth 1 -type d \
                  -printf '%f\n' | sort -r); do
                f=$(find "$branch_dir/$s/$r" -maxdepth 1 -name '*.html' -printf '%f\n' \
                  | sort | head -1)
                [[ -z "$f" ]] && continue
                echo "<li><a href='${PAGES_BASE}/${s}/${r}/${f}'>${r}</a></li>"
              done
              echo "</ul>"
            done
            echo "</body></html>"
          } > "$branch_dir/index.html"

          git -C "$branch_dir" add -A
          if git -C "$branch_dir" diff --cached --quiet; then
            echo "报告无变化，无需提交。"
          else
            git -C "$branch_dir" commit -m "发布全量回归报告 ${HOME_RUN_ID:-unknown}"
            git -C "$branch_dir" push origin test-reports
          fi

          echo "index_url=${PAGES_BASE}/index.html" >> "$GITHUB_OUTPUT"
          echo "报告索引：$raw_base/index.html"

      # ---- 最终退出码 ----
      - name: 综合退出码
        if: always()
        shell: bash
        run: |
          home="${{ steps.home_suite.outputs.exit_code }}"
          mem="${{ steps.mem_suite.outputs.exit_code }}"
          cart="${{ steps.cart_suite.outputs.exit_code }}"
          echo "首页=$home  会员=$mem  购物车=$cart"
          # 任一套件失败则整体失败
          for code in "$home" "$mem" "$cart"; do
            if [[ -n "$code" && "$code" != "0" ]]; then exit 1; fi
          done
