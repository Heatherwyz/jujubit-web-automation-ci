name: 每日定时调度（北京 09:00 / 21:00）

# 这是唯一的定时入口：由它按顺序触发四个工作流。
# 各业务工作流本身不再配 schedule，避免 GitHub cron 迟到 4-5 小时的问题。
#
# 为什么还用 GitHub cron 而不是外部服务：
# 这个调度工作流本身只发 4 次 API 调用（< 1 秒），不跑测试，所以即使
# GitHub cron 迟到几小时，它也只是"晚触发"而不是"不触发"。真正跑测试
# 的工作流通过 workflow_dispatch 被精确调起，不受 cron 延迟影响。
#
# 北京时间 09:00 = UTC 01:00；21:00 = UTC 13:00。
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      skip_offline:
        description: "跳过离线检查（调试用）"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: 触发全量回归
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 按顺序触发四个工作流
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          dispatch() {
            local workflow="$1"
            local inputs="${2:-}"
            echo "触发 $workflow ..."
            if [[ -n "$inputs" ]]; then
              gh workflow run "$workflow" --repo "$REPO" --json "$inputs"
            else
              gh workflow run "$workflow" --repo "$REPO"
            fi
            echo "  已触发"
          }

          # 1. 离线检查（最快，< 30 秒，先跑完确认代码没坏）
          if [[ "${{ inputs.skip_offline }}" != "true" ]]; then
            dispatch "offline-checks.yml"
            sleep 5
          fi

          # 2. 首页 UI 回归（不需要登录态，约 15 分钟）
          dispatch "daily-ui-tests.yml"
          sleep 5

          # 3. 会员 UI 回归（约 15 分钟，与首页串行）
          dispatch "membership-ui-tests.yml"
          sleep 5

          # 4. 购物车 UI 回归（需要登录态，约 30 分钟，排最后）
          dispatch "cart-ui-tests.yml" '{"suite":"daily"}'

          echo ""
          echo "全部触发完成。四个工作流共用并发组 jujubit-site-ui-tests，"
          echo "会自动排队串行执行，不会同时访问站点。"
