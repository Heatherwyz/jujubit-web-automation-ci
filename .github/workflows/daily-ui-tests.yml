name: JuJuBit 首页 UI Tests

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 的 cron 使用 UTC；01:00 UTC 即中国标准时间每日 09:00。
    - cron: "0 1 * * *"

# 首页和购物车工作流共用同一个并发组，任何时刻只允许一个 Runner 访问站点。
# 不取消正在执行的完整购物车回归，后来的定时任务会排队，避免重跑又产生一轮登录请求。
concurrency:
  group: jujubit-site-ui-tests
  cancel-in-progress: false

permissions:
  # write 是为了把 HTML 报告推到 test-reports 分支；仅该分支被写入，
  # 主分支不受影响（发布步骤显式指定 push origin test-reports）。
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 让报告目录和卡片中的时间戳使用中国标准时间，便于和每日 09:00 调度对应。
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-playwright.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-playwright.txt
          python -m playwright install --with-deps chromium

      - name: 校验报告与频控逻辑
        # 这些离线单测不访问站点，先验证飞书统计、429 重试和链接缓存逻辑。
        run: python -m pytest tests -q

      - name: 记录测试开始时间
        id: test_meta
        shell: bash
        run: echo "started_at=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_OUTPUT"

      - name: 执行首页 UI 回归
        id: suite
        shell: bash
        run: |
          # 每日工作流不读取登录态，也不执行购物车；购物车在独立工作流低频执行。
          set +e
          python run_all.py
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 定位本次报告
        id: report
        if: always()
        shell: bash
        run: |
          # run_all.py 每次只创建一个以时间戳命名的目录；只上传该目录，避免把历史报告重复打包。
          run_dir=$(find artifacts/runs -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null | sort | tail -n 1 || true)
          if [[ -z "$run_dir" ]]; then
            echo "未找到本次运行目录：artifacts/runs" >&2
            exit 1
          fi
          run_dir=${run_dir%/}
          run_id=$(basename "$run_dir")
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "results_xml=${run_dir}/results.xml" >> "$GITHUB_OUTPUT"
          if [[ -f "${run_dir}/jujubit-report-${run_id}.html" ]]; then
            {
              echo "### JuJuBit 自动化测试报告"
              echo "- 本次目录：\`${run_id}\`"
              echo "- HTML 报告和失败录像：见下方 Artifact 下载项"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传 HTML 报告、失败截图和录像
        id: upload_report
        if: always() && steps.report.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          # Artifact 名称包含 run_all.py 生成的时间戳，可作为唯一标识。
          name: jujubit-home-report-${{ steps.report.outputs.run_id }}
          path: ${{ steps.report.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 30

      # 把 HTML 报告发布到 test-reports 分支，得到可直接点开的链接。
      # 不用 GitHub Pages：本仓库是私有仓库，Pages 需付费套餐且内容公网可访问，
      # 而报告含站点地址与失败详情。提交到同仓库分支后链接仍受仓库权限保护。
      - name: 检出 test-reports 分支
        id: checkout_reports
        if: always() && steps.report.outputs.run_dir != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: test-reports
          path: .report-branch
          # 凭据由 action 管理，不出现在命令行参数里。
          persist-credentials: true

      - name: 发布报告到 test-reports 分支
        id: publish_report
        if: always() && steps.report.outputs.run_dir != ''
        continue-on-error: true
        shell: bash
        env:
          RUN_DIR: ${{ steps.report.outputs.run_dir }}
          RUN_ID: ${{ steps.report.outputs.run_id }}
          SUITE: home
          KEEP: "30"
        run: |
          set -euo pipefail
          # RUN_ID 由 run_all.py 生成的时间戳，这里再校验一次，拒绝路径分隔符。
          if [[ ! "$RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "RUN_ID 含非法字符：$RUN_ID" >&2
            exit 1
          fi
          report=$(find "$RUN_DIR" -maxdepth 1 -name '*.html' -print | sort | tail -1)
          if [[ -z "$report" ]]; then
            echo "未找到 HTML 报告，跳过发布。" >&2
            exit 0
          fi

          branch_dir=.report-branch
          if [[ ! -d "$branch_dir/.git" ]]; then
            # 分支还不存在：建孤立分支，不带主分支历史。
            rm -rf "$branch_dir"
            mkdir -p "$branch_dir"
            git -C "$branch_dir" init --initial-branch test-reports
            git -C "$branch_dir" remote add origin \
              "${{ github.server_url }}/${{ github.repository }}.git"
            git -C "$branch_dir" config \
              http."${{ github.server_url }}/".extraheader \
              "AUTHORIZATION: basic $(printf 'x-access-token:%s' \
              "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)"
          fi
          git -C "$branch_dir" config user.name 'github-actions[bot]'
          git -C "$branch_dir" config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          dest="$branch_dir/$SUITE/$RUN_ID"
          mkdir -p "$dest"
          cp "$report" "$dest/"

          # 每个套件只保留最近 KEEP 份，避免仓库体积膨胀（单份约 36 KB）。
          suite_dir="$branch_dir/$SUITE"
          mapfile -t runs < <(find "$suite_dir" -mindepth 1 -maxdepth 1 -type d \
            -printf '%f\n' | sort)
          total=${#runs[@]}
          if (( total > KEEP )); then
            for (( i=0; i < total - KEEP; i++ )); do
              rm -rf "$suite_dir/${runs[i]}"
              echo "清理旧报告：${runs[i]}"
            done
          fi

          # 生成索引页，便于翻历史。
          {
            echo "<!doctype html><html lang='zh'><head><meta charset='utf-8'>"
            echo "<title>JuJuBit 自动化测试报告</title>"
            echo "<style>body{font-family:system-ui,sans-serif;margin:32px;max-width:900px}"
            echo "h1{font-size:20px}h2{font-size:16px;margin-top:24px}li{margin:4px 0}</style>"
            echo "</head><body><h1>JuJuBit 自动化测试报告</h1>"
            echo "<p>按套件和运行时间归档，每个套件保留最近 ${KEEP} 份。链接受仓库权限保护。</p>"
            for s in $(find "$branch_dir" -mindepth 1 -maxdepth 1 -type d \
                -not -name '.*' -printf '%f\n' | sort); do
              echo "<h2>${s}</h2><ul>"
              for r in $(find "$branch_dir/$s" -mindepth 1 -maxdepth 1 -type d \
                  -printf '%f\n' | sort -r); do
                f=$(find "$branch_dir/$s/$r" -maxdepth 1 -name '*.html' -printf '%f\n' \
                  | sort | head -1)
                [[ -z "$f" ]] && continue
                echo "<li><a href='${{ github.server_url }}/${{ github.repository }}/blob/test-reports/${s}/${r}/${f}?raw=1'>${r}</a></li>"
              done
              echo "</ul>"
            done
            echo "</body></html>"
          } > "$branch_dir/index.html"

          git -C "$branch_dir" add -A
          if git -C "$branch_dir" diff --cached --quiet; then
            echo "报告无变化，无需提交。"
          else
            git -C "$branch_dir" commit -m "发布 home 测试报告 $RUN_ID"
            git -C "$branch_dir" push origin test-reports
          fi

          name=$(basename "$report")
          url="${{ github.server_url }}/${{ github.repository }}/blob/test-reports/$SUITE/$RUN_ID/$name?raw=1"
          index="${{ github.server_url }}/${{ github.repository }}/blob/test-reports/index.html?raw=1"
          echo "report_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "- [打开本次 HTML 报告]($url)"
            echo "- [历史报告索引]($index)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "报告链接：$url"

      - name: 推送结果到飞书群
        if: always()
        continue-on-error: true
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          RESULTS_XML: ${{ steps.report.outputs.results_xml }}
          REPORT_RUN_ID: ${{ steps.report.outputs.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          REPORT_HTML_URL: ${{ steps.publish_report.outputs.report_url }}
          TEST_EXIT_CODE: ${{ steps.suite.outputs.exit_code }}
          TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
          TEST_ACTOR: ${{ github.actor }}
          TEST_COMMIT: ${{ github.sha }}
          TEST_STARTED_AT: ${{ steps.test_meta.outputs.started_at }}
        run: python scripts/send_lark_test_report.py

      - name: 保持 GitHub 运行结果与测试结果一致
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.suite.outputs.exit_code }}"
          # 如果测试进程在生成输出前就崩溃，仍让 Job 明确失败。
          if [[ -z "$exit_code" ]]; then exit_code=1; fi
          exit "$exit_code"
