name: 离线检查

# 离线层不访问 jujubit.ai：没有登录态、不受站点频控影响，因此可以在每个 PR 和
# 每次推送上无条件运行，作为提交前的确定性闸门。
#
# "离线"指不访问站点，不等于不用浏览器：注入 JS 的可见性与遮挡判定（
# tests/test_click_visible_control_js.py）必须在真实 Chromium 里验证，它只加载
# set_content 提供的本地 HTML，不发任何外部请求。
# 需要真实访问站点的 UI 回归仍由 daily-ui-tests.yml / cart-ui-tests.yml 按计划执行。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # schedule 已停用：离线检查在每次 push/PR 时已自动跑，不需要定时。
  # 删 schedule 时必须连 cron 一起删——只删 "schedule:" 会留下悬空的
  # "- cron:"，它被 YAML 解析成 workflow_dispatch 的值，GitHub 判定触发器
  # 畸形后直接不分配 Runner，push 触发全部 0 job 秒失败（2026-09-23 实测
  # 连续 3 次）。

# 与访问站点的工作流不共用并发组：本工作流不产生任何站点请求，
# 不需要为避免撞 WAF 而排队。
# event_name 进组名，避免迟到的 schedule 把本机 workflow_dispatch 取消掉
# （本工作流 cancel-in-progress 对 PR/push 仍为 true）。
concurrency:
  group: jujubit-offline-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: 迟到 schedule 去重
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4

      - name: 判断是否跳过迟到的 GitHub cron
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "非 schedule 事件，不去重。"
            exit 0
          fi
          json="${RUNNER_TEMP}/dispatch-runs.json"
          if ! gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/offline-checks.yml/runs?event=workflow_dispatch&per_page=30" \
            > "$json"; then
            echo "查询 workflow_dispatch 失败，fail-open 不跳过。" >&2
            exit 0
          fi
          python3 scripts/should_skip_late_schedule.py \
            --workflow-file offline-checks.yml \
            --runs-json "$json" \
            --ref "${GITHUB_REF_NAME}" \
            >> "$GITHUB_OUTPUT"

  offline:
    name: 离线单测与契约规则
    needs: gate
    if: always() && needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-playwright.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-playwright.txt

      - name: 安装 Chromium
        # 注入 JS 的可见性与遮挡判定必须在真实浏览器里验证（只加载本地
        # set_content 的 HTML，不访问站点）。只装 chromium，不带 --with-deps：
        # ubuntu-latest 已含所需系统库，省一次 apt 安装。
        run: python -m playwright install chromium

      - name: 运行离线单测
        # 覆盖服务端 HTML 契约规则、429 退避与熔断冷却、报告口径、飞书卡片
        # 与 Webhook 校验。这些用例结论确定，任何一条红都表示逻辑真的被改坏。
        run: python -m pytest -q

      - name: 校验线上套件可正常收集
        # 只做 collect-only：确保 UI 套件没有导入错误或标记拼写问题，
        # 但不真正访问站点。
        run: python -m pytest -c pytest-playwright.ini --collect-only -q

      - name: 校验 fixture 依赖声明
        # collect-only 抓不到运行期问题。曾经出现过契约层 fixture 自己调
        # sync_playwright()，与浏览器层的 session fixture 冲突报
        # "Sync API inside the asyncio loop"——单独跑任一层都正常，只有混跑才炸。
        # 真正混跑需要访问站点，不能放在离线层；改为静态检查：线上 fixture 不得
        # 自行创建 Playwright 运行时，必须复用 conftest 的 playwright_runtime。
        run: python -m pytest tests/test_fixture_wiring.py -q --no-header
